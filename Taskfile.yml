version: "3"

tasks:
  dev:
    deps: [templ, css]
    cmds:
      - task --parallel templ-watch server-watch css-watch

  server-watch:
    deps: [templ, css]
    cmds:
      - go tool air -c .air.toml

  build:
    deps: [sqlc, templ, css]
    cmds:
      - go build ./cmd/server

  test:
    deps: [sqlc, templ]
    cmds:
      - go test ./...

  vet:
    deps: [sqlc, templ]
    cmds:
      - go vet ./...

  migrate:
    cmds:
      - go run ./cmd/server -migrate-only

  seed:
    cmds:
      - go run ./cmd/server -seed-only

  reset-read-models:
    cmds:
      - go run ./cmd/server -reset-read-models

  templ:
    sources:
      - "**/*.templ"
    generates:
      - "**/*_templ.go"
    cmds:
      - go tool templ generate

  templ-watch:
    cmds:
      - go tool templ generate -watch

  sqlc:
    sources:
      - sqlc.yaml
      - queries/**/*.sql
      - migrations/**/*.sql
    generates:
      - internal/dbsql/**/*.go
    cmds:
      - go tool sqlc generate

  css:
    sources:
      - src/**/*.css
      - src/daisyui/**/*.js
      - internal/**/*.templ
      - internal/**/*.go
    generates:
      - static/style.css
    cmds:
      - go tool gotailwind -i src/input.css -o static/style.css

  css-watch:
    cmds:
      - go tool gotailwind -i src/input.css -o static/style.css -w
