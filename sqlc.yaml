version: "2"
sql:
  - engine: sqlite
    schema: ./migrations
    queries: ./queries
    gen:
      go:
        package: dbsql
        out: internal/dbsql
        sql_package: database/sql
        emit_json_tags: true
        overrides:
          - db_type: "text"
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: "TEXT"
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: "bigint"
            nullable: true
            go_type:
              type: int64
              pointer: true
          - db_type: "BIGINT"
            nullable: true
            go_type:
              type: int64
              pointer: true
          - db_type: "integer"
            nullable: true
            go_type:
              type: int64
              pointer: true
          - db_type: "INTEGER"
            nullable: true
            go_type:
              type: int64
              pointer: true
          - db_type: "timestamp"
            nullable: true
            go_type:
              import: database/sql
              type: NullTime
          - db_type: "timestamp"
            nullable: false
            go_type:
              import: database/sql
              type: NullTime
          - db_type: "TIMESTAMP"
            nullable: true
            go_type:
              import: database/sql
              type: NullTime
          - db_type: "TIMESTAMP"
            nullable: false
            go_type:
              import: database/sql
              type: NullTime
          - column: "*.event_positions"
            go_type:
              type: "[]byte"
